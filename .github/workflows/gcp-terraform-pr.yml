name: GCP Terraform — PR Validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'gcp/**'

permissions:
  id-token: write
  contents: read
  pull-requests: write
  security-events: write

env:
  TF_VERSION: '1.9.8'
  WORKING_DIR: gcp

jobs:
  # ── Gateway 1: Secret Scanning ──────────────────────────────────────────────
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        run: gitleaks detect --source . --redact --no-git --config .gitleaks.toml

  # ── Gateway 2: Validate, Lint & Security Scan (with SARIF upload) ───────────
  validate:
    name: Validate & Lint
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: ${{ env.WORKING_DIR }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PIPELINE_SA }}

      - name: terraform init
        run: terraform init -backend-config="prefix=gcp/dev"
        working-directory: ${{ env.WORKING_DIR }}

      - name: terraform validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive
        working-directory: ${{ env.WORKING_DIR }}

      - name: checkov security scan
        run: |
          pip install checkov==3.2.0 --quiet
          checkov -d . --framework terraform --output sarif 2>/dev/null > results.sarif; true
          checkov -d . --framework terraform --quiet --compact
        working-directory: ${{ env.WORKING_DIR }}

      - name: Upload checkov SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.WORKING_DIR }}/results.sarif
          category: checkov-gcp

  # ── Plan (with destroy annotation in PR comment) ─────────────────────────────
  plan-dev:
    name: Plan — DEV
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_PIPELINE_SA }}

      - name: terraform init
        run: terraform init -backend-config="prefix=gcp/dev"
        working-directory: ${{ env.WORKING_DIR }}

      - name: Import existing KMS resources (GCP KMS cannot be deleted)
        run: |
          PROJECT_ID=$(grep 'gcp_project_id' dev.tfvars | grep -oP '"\K[^"]+')
          REGION=$(grep '^region' dev.tfvars | grep -oP '"\K[^"]+')
          ACRONYM=$(grep 'project_acronym' dev.tfvars | grep -oP '"\K[^"]+')
          ENV="dev"
          KR_BASE="projects/${PROJECT_ID}/locations/${REGION}/keyRings/${ACRONYM}-kr-${ENV}"
          STATE=$(terraform state list 2>/dev/null || true)
          import_if_missing() {
            local addr=$1 id=$2
            if ! echo "$STATE" | grep -q "^${addr}$"; then
              terraform import -var-file=dev.tfvars "$addr" "$id" 2>/dev/null && echo "Imported: $addr" || true
            fi
          }
          import_if_missing "google_kms_key_ring.main"               "${KR_BASE}"
          import_if_missing "google_kms_crypto_key.gke"              "${KR_BASE}/cryptoKeys/key-gke-${ACRONYM}-${ENV}"
          import_if_missing "google_kms_crypto_key.storage"          "${KR_BASE}/cryptoKeys/key-storage-${ACRONYM}-${ENV}"
          import_if_missing "google_kms_crypto_key.artifact_registry" "${KR_BASE}/cryptoKeys/key-ar-${ACRONYM}-${ENV}"
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: terraform plan
        id: plan
        run: terraform plan -var-file="dev.tfvars" -no-color 2>&1 | tee plan_output.txt
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

      - name: Count destructive changes
        id: destroys
        run: |
          DESTROYS=$(grep -c "# .* will be destroyed" plan_output.txt 2>/dev/null || echo "0")
          echo "count=$DESTROYS" >> $GITHUB_OUTPUT
        working-directory: ${{ env.WORKING_DIR }}

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKING_DIR }}/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... [truncated — see full output in Actions run]'
              : plan;
            const destroyCount = parseInt('${{ steps.destroys.outputs.count }}') || 0;
            const destroyWarning = destroyCount > 0
              ? `\n\n> ⚠️ **DESTROY WARNING: ${destroyCount} resource(s) will be permanently destroyed. Review carefully before merging.**`
              : '';
            const body = [
              '## Terraform Plan — DEV (GCP)',
              destroyWarning,
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '</details>',
              '',
              `**Result:** ${{ steps.plan.outcome == 'success' && '✅ Plan succeeded' || '❌ Plan failed' }}`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Add plan to step summary
        run: |
          echo "### Terraform Plan — DEV (GCP)" >> $GITHUB_STEP_SUMMARY
          echo '```hcl' >> $GITHUB_STEP_SUMMARY
          cat ${{ env.WORKING_DIR }}/plan_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
